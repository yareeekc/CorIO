<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Corio Shell - Main File</title>
    <link rel="stylesheet" href="style.css">
    <script src="app.js" defer></script>
    <script src="win-manager.js" defer></script>
    <link rel="icon" href="icons/corio.ico">
</head>
<body>
    <div id="desktop"></div>

    <img src="wallpapers/1.jpg" alt="wallpapers" id="background-img" draggable="false">
    <span id="down-panel-span">
        <button id="start-btn" class="circle-button">
            <img src="icons/start.ico" alt="S">
        </button>
        <span id="working-apps-list"></span>
    </span>
    <span id="start-panel-span">
        <span id="user-data">
            <img src="icons/corio.ico" alt="Co">
            <span id="username">CorIO User</span>
        </span>
        <span id="app-list">
            <button class="circle-button" onclick="createWindow('Explorer', 'apps/explorer/index.html', 'apps/explorer/icons/logo.ico')">
                <img src="apps/explorer/icons/logo.ico" alt="explorer">
            </button>
            <button class="circle-button" onclick="createWindow('Piped', 'apps/piped/index.html', 'apps/piped/logo.png')">
                <img src="apps/piped/logo.png" alt="piped">
            </button>
            <button class="circle-button" onclick="createWindow('Calculator', 'apps/calculator/index.html', 'apps/calculator/icons/logo.ico')">
                <img src="apps/calculator/icons/logo.ico" alt="calc">
            </button>
            <button class="circle-button" onclick="createWindow('Browc', 'apps/browc/index.html', 'apps/browc/icons/logo.ico')">
                <img src="apps/browc/icons/logo.ico" alt="Browc">
            </button>
        </span>
        <span id="power-btns">
                <button id="power-btn" class="circle-button" onclick="sendCommand('poweroff')">
                    <img src="icons/power.ico" alt="power">
                </button>
                <button id="suspend-btn" class="circle-button" onclick="sendCommand('suspend')">
                    <img src="icons/suspend.ico" alt="suspend">
                </button>
                <button id="reboot-btn" class="circle-button" onclick="sendCommand('reboot')">
                    <img src="icons/reboot.ico" alt="reboot">
                </button>
        </span>
    </span>

<template id="window-template">
  <div class="window" style="left: 100px; top: 100px; width: 400px; height: 300px;">
    <div class="window-header">
        <span class="window-title">Приложение</span>
        <div class="header-controls">
            <button class="maximize-btn">🗖</button>
            <button class="close-btn">X</button>
        </div>
    </div>
    <div class="window-content">
        <iframe src="" frameborder="0" class="window-iframe"></iframe>
    </div>
    <div class="resizer"></div>
  </div>
</template>

</body>
</html>
